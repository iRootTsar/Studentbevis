name: Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  unsigned-ipa:
    name: Build unsigned IPA for AltStore
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned device app
        run: |
          set -euo pipefail

          xcodebuild \
            -project StudentbevisAppen.xcodeproj \
            -scheme StudentbevisAppen \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/StudentbevisAppen.app"
          IPA_PATH="$PWD/build/StudentbevisAppen-UNSIGNED-AltStore.ipa"

          test -d "$APP_PATH"
          rm -rf "$PWD/build/Payload" "$IPA_PATH"
          mkdir -p "$PWD/build/Payload"
          cp -R "$APP_PATH" "$PWD/build/Payload/"

          cd "$PWD/build"
          /usr/bin/ditto -c -k --keepParent Payload "$IPA_PATH"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentbevisAppen-UNSIGNED-AltStore
          path: build/StudentbevisAppen-UNSIGNED-AltStore.ipa
          retention-days: 30

      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/StudentbevisAppen-UNSIGNED-AltStore.ipa
          body: |
            This IPA is unsigned.

            It is intended for AltStore/AltServer or another local signing tool.
            It is not an App Store, TestFlight, or Ad Hoc release.
            It will not install directly on stock iOS by tapping the file.
